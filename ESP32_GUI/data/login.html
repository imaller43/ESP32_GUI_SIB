<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="/style.css">

  <script>
    (function () {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="icon" type="image/png" href="/SIB_Favicon.png">
</head>


<body class="login-page">

  <div class="login-nav">
    <div style="display: flex; align-items: center; justify-content: center; gap: 15px;">
      <img id="navLogo" src="/SIB1_logo.png" alt="SIB">
      <img src="/shrdc_logo.png" alt="SHRDC Logo">
    </div>
    <button type="button" class="theme-switch" id="themeToggle" title="Toggle Theme"></button>

  </div>

  <div class="login-box">
    <h1>ESP32 Login</h1>
    <div id="errorMsg">Incorrect username or password.</div>
    <form method="POST" action="/login">
      <input type="text" name="username" placeholder="Username" required><br>
      <input type="password" name="password" placeholder="Password" required><br>
      <button type="submit" class="btn-submit">Login</button>
    </form>
  </div>

  <div class="site-footer">&copy; SIB. All rights reserved.</div>

  <script>
    if (new URLSearchParams(window.location.search).get('error') === '1') {
      document.getElementById('errorMsg').style.display = 'block';
    }
  </script>

  <script>
    (function () {
      const toggleBtn = document.getElementById('themeToggle');
      const navLogo = document.getElementById('navLogo');

      function updateUI(theme) {
        if (toggleBtn) {
          toggleBtn.innerHTML = theme === 'dark' ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>' : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
        }
        if (navLogo) {
          navLogo.src = theme === 'dark' ? '/SIB_logo.png' : '/SIB1_logo.png';
        }
      }

      updateUI(localStorage.getItem('theme') || 'light');

      if (toggleBtn) {
        toggleBtn.addEventListener('click', function () {
          let theme = document.documentElement.getAttribute('data-theme');
          let newTheme = theme === 'dark' ? 'light' : 'dark';

          if (newTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
          localStorage.setItem('theme', newTheme);
          updateUI(newTheme);
        });
      }
    })();
  </script>
</body>


</html>
